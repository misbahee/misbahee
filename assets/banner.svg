<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none" role="img" aria-label="Misbah — Mathematics to Machine Learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes pulse   { 0%,100%{opacity:.15} 50%{opacity:.75} }
      @keyframes twinkle { 0%,100%{opacity:.4; r:3} 50%{opacity:1; r:4.5} }
      @keyframes drift   { 0%{transform:translateY(0);opacity:.25} 50%{transform:translateY(-12px);opacity:.8} 100%{transform:translateY(0);opacity:.25} }
      @keyframes breathe { 0%,100%{opacity:.85} 50%{opacity:1} }
      @keyframes fadein  { 0%,100%{opacity:.7} 50%{opacity:1} }
      .link  { stroke:url(#neon); stroke-width:1.2; animation:pulse 3s ease-in-out infinite; }
      .node  { fill:#00d4ff; filter:url(#soft); animation:twinkle 2.6s ease-in-out infinite; }
      .sym   { fill:#7b8bb5; font-family:'Fira Code',monospace; animation:drift 6s ease-in-out infinite; }
      .title { font-family:'Segoe UI',Verdana,sans-serif; font-weight:800; fill:url(#neon); filter:url(#soft); animation:breathe 3.5s ease-in-out infinite; }
      .sub   { font-family:'Fira Code',monospace; fill:#8b9bc7; animation:fadein 2.8s ease-out forwards; }
      .tag   { font-family:'Fira Code',monospace; fill:#00d4ff; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)" opacity="0.5"/>

  <!-- ===== LEFT neural network ===== -->
  <g stroke-linecap="round">
    <line class="link" style="animation-delay:0s"    x1="90" y1="120" x2="210" y2="90"/>
    <line class="link" style="animation-delay:.3s"   x1="90" y1="120" x2="210" y2="160"/>
    <line class="link" style="animation-delay:.6s"   x1="90" y1="120" x2="210" y2="230"/>
    <line class="link" style="animation-delay:.9s"   x1="90" y1="210" x2="210" y2="90"/>
    <line class="link" style="animation-delay:1.2s"  x1="90" y1="210" x2="210" y2="160"/>
    <line class="link" style="animation-delay:1.5s"  x1="90" y1="210" x2="210" y2="230"/>
    <line class="link" style="animation-delay:.4s"   x1="210" y1="90"  x2="330" y2="160"/>
    <line class="link" style="animation-delay:.8s"   x1="210" y1="160" x2="330" y2="160"/>
    <line class="link" style="animation-delay:1.1s"  x1="210" y1="230" x2="330" y2="160"/>
  </g>
  <g>
    <circle class="node" style="animation-delay:0s"   cx="90"  cy="120"/>
    <circle class="node" style="animation-delay:.5s"  cx="90"  cy="210"/>
    <circle class="node" style="animation-delay:.2s"  cx="210" cy="90"/>
    <circle class="node" style="animation-delay:.7s"  cx="210" cy="160"/>
    <circle class="node" style="animation-delay:1s"   cx="210" cy="230"/>
    <circle class="node" style="animation-delay:.9s"  cx="330" cy="160"/>
  </g>

  <!-- ===== RIGHT neural network (mirror) ===== -->
  <g stroke-linecap="round">
    <line class="link" style="animation-delay:.2s"   x1="1110" y1="120" x2="990" y2="90"/>
    <line class="link" style="animation-delay:.5s"   x1="1110" y1="120" x2="990" y2="160"/>
    <line class="link" style="animation-delay:.8s"   x1="1110" y1="120" x2="990" y2="230"/>
    <line class="link" style="animation-delay:1.1s"  x1="1110" y1="210" x2="990" y2="90"/>
    <line class="link" style="animation-delay:1.4s"  x1="1110" y1="210" x2="990" y2="160"/>
    <line class="link" style="animation-delay:.1s"   x1="1110" y1="210" x2="990" y2="230"/>
    <line class="link" style="animation-delay:.6s"   x1="990" y1="90"  x2="870" y2="160"/>
    <line class="link" style="animation-delay:1s"    x1="990" y1="160" x2="870" y2="160"/>
    <line class="link" style="animation-delay:1.3s"  x1="990" y1="230" x2="870" y2="160"/>
  </g>
  <g>
    <circle class="node" style="animation-delay:.3s"  cx="1110" cy="120"/>
    <circle class="node" style="animation-delay:.8s"  cx="1110" cy="210"/>
    <circle class="node" style="animation-delay:.1s"  cx="990"  cy="90"/>
    <circle class="node" style="animation-delay:.6s"  cx="990"  cy="160"/>
    <circle class="node" style="animation-delay:1.1s" cx="990"  cy="230"/>
    <circle class="node" style="animation-delay:.4s"  cx="870"  cy="160"/>
  </g>

  <!-- ===== floating math symbols ===== -->
  <g font-size="30">
    <text class="sym" style="animation-delay:0s"   x="150" y="60">∑</text>
    <text class="sym" style="animation-delay:1.2s" x="420" y="70">∫</text>
    <text class="sym" style="animation-delay:2s"   x="760" y="66">∇</text>
    <text class="sym" style="animation-delay:.6s"  x="1030" y="60">∂</text>
    <text class="sym" style="animation-delay:1.6s" x="300" y="290">λ</text>
    <text class="sym" style="animation-delay:2.4s" x="600" y="298">θ</text>
    <text class="sym" style="animation-delay:.9s"  x="880" y="292">π</text>
    <text class="sym" style="animation-delay:3s"   x="500" y="55">σ</text>
    <text class="sym" style="animation-delay:1.9s" x="700" y="290">μ</text>
  </g>

  <!-- ===== center title ===== -->
  <text class="title" x="600" y="160" text-anchor="middle" font-size="72" letter-spacing="8">MISBAH</text>
  <text class="tag"   x="600" y="150" text-anchor="middle" font-size="13" opacity="0.0"></text>

  <!-- ===== subtitle ===== -->
  <text class="sub" x="600" y="205" text-anchor="middle" font-size="20" letter-spacing="2">
    B.Sc. Mathematics  →  ML Systems Engineer &amp; Architect
  </text>

  <!-- ===== animated gradient-descent dot on a loss curve ===== -->
  <path id="loss" d="M 470 250 Q 560 230 600 258 Q 640 285 730 250" stroke="#2a3550" stroke-width="2" fill="none" opacity="0.7"/>
  <circle r="6" fill="#00d4ff" filter="url(#soft)">
    <animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1">
      <mpath href="#loss"/>
    </animateMotion>
  </circle>
</svg>
